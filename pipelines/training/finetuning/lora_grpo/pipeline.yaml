          test\"]\n            log_message(f\"Split complete: {len(train_ds)} train,\
          \ {len(eval_ds)} eval\")\n\n        # Save datasets as JSONL files\n   \
          \     import json as _json\n\n        def _write_jsonl(ds: Dataset, path:\
          \ str):\n            \"\"\"Write dataset to JSONL, normalizing tool-call\
