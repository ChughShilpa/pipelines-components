          \            data_files=f\"s3://{s3_path}\",\n            storage_options=storage_options,\n\
          \            split=\"train\",\n            cache_dir=hf_datasets_cache,\n\
          \        )\n\n        log_message(f\"Loaded {len(dataset)} examples from\
          \ AWS S3\")\n        return dataset\n\n    def download_from_http(http_url:\
          \ str) -> Dataset:\n        \"\"\"Download dataset from HTTP/HTTPS URL (e.g.,\
