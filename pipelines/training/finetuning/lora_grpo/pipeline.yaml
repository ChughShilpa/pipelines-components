# PIPELINE DEFINITION
# Name: lora-grpo-pipeline
# Description: LoRA GRPO pipeline: reinforcement learning from verifiable rewards using ART backend on a single GPU TrainJob
# Inputs:
#    phase_00_infra_man_pvc_name: str
#    phase_01_dataset_man_data_uri: str [Default: 'hf://Agent-Ark/Toucan-1.5M:Qwen3']
#    phase_02_train_man_group_size: int [Default: 4.0]
#    phase_02_train_man_lora_alpha: int [Default: 16.0]
#    phase_02_train_man_lora_r: int [Default: 16.0]
#    phase_02_train_man_model: str [Default: 'Qwen/Qwen3-4B']
#    phase_02_train_man_num_iterations: int [Default: 50.0]
#    phase_02_train_man_prompt_batch_size: int [Default: 50.0]
#    phase_02_train_opt_annotations: str [Default: '']
#    phase_02_train_opt_cpu: str [Default: '4']
#    phase_02_train_opt_data_config: str [Default: 'Qwen3']
#    phase_02_train_opt_enforce_eager: bool [Default: True]
#    phase_02_train_opt_env_vars: str [Default: '']
#    phase_02_train_opt_gpu: int [Default: 1.0]
#    phase_02_train_opt_gpu_memory_utilization: float [Default: 0.45]
#    phase_02_train_opt_labels: str [Default: '']
#    phase_02_train_opt_learning_rate: float [Default: 1e-05]
#    phase_02_train_opt_memory: str [Default: '64Gi']
#    phase_02_train_opt_n_train: int [Default: 200.0]
#    phase_02_train_opt_runtime: str [Default: 'training-hub']
#    phase_04_registry_man_address: str
#    phase_04_registry_man_name: str [Default: 'grpo-model']
#    phase_04_registry_man_version: str [Default: '1.0.0']
#    phase_04_registry_opt_author: str [Default: 'pipeline']
#    phase_04_registry_opt_description: str [Default: '']
#    phase_04_registry_opt_format_name: str [Default: 'pytorch']
#    phase_04_registry_opt_format_version: str [Default: '1.0']
#    phase_04_registry_opt_port: int [Default: 8080.0]
#    phase_05_deploy_man_namespace: str
#    phase_05_deploy_opt_cpu_requests: str [Default: '2']
#    phase_05_deploy_opt_gpu_count: int [Default: 1.0]
#    phase_05_deploy_opt_max_model_len: int [Default: 4096.0]
#    phase_05_deploy_opt_max_replicas: int [Default: 1.0]
#    phase_05_deploy_opt_memory_requests: str [Default: '8Gi']
#    phase_05_deploy_opt_min_replicas: int [Default: 1.0]
#    phase_05_deploy_opt_tokenizer_mode: str [Default: 'auto']
components:
  comp-condition-1:
    dag:
      tasks:
        kubeflow-model-registry:
          cachingOptions: {}
          componentRef:
            name: comp-kubeflow-model-registry
          inputs:
            artifacts:
              eval_metrics:
                componentInputArtifact: pipelinechannel--grpo-eval-output_metrics
              eval_results:
                componentInputArtifact: pipelinechannel--grpo-eval-output_reward_chart
              input_metrics:
                componentInputArtifact: pipelinechannel--train-model-output_metrics
              input_model:
                componentInputArtifact: pipelinechannel--train-model-output_model
            parameters:
              author:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_author
              model_description:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_description
              model_format_name:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_format_name
              model_format_version:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_format_version
              model_name:
                componentInputParameter: pipelinechannel--phase_04_registry_man_name
              model_pvc_name:
                componentInputParameter: pipelinechannel--phase_00_infra_man_pvc_name
              model_version:
                componentInputParameter: pipelinechannel--phase_04_registry_man_version
              pvc_mount_path:
                runtimeValue:
                  constant: /mnt/pipeline
              registry_address:
                componentInputParameter: pipelinechannel--phase_04_registry_man_address
              registry_port:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_port
              shared_log_file:
                runtimeValue:
                  constant: pipeline_log.txt
              source_namespace:
                runtimeValue:
                  constant: ''
              source_pipeline_name:
                runtimeValue:
                  constant: lora-grpo-pipeline
              source_pipeline_run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              source_pipeline_run_name:
                runtimeValue:
                  constant: '{{$.pipeline_job_name}}'
          taskInfo:
            name: kubeflow-model-registry
        model-deployment:
          cachingOptions: {}
          componentRef:
            name: comp-model-deployment
          dependentTasks:
          - kubeflow-model-registry
          inputs:
            parameters:
              cpu_limits:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_cpu_requests
              cpu_requests:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_cpu_requests
              gpu_count:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_gpu_count
              max_model_len:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_max_model_len
              max_replicas:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_max_replicas
              memory_limits:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_memory_requests
              memory_requests:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_memory_requests
              min_replicas:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_min_replicas
              model_cache_pvc:
                componentInputParameter: pipelinechannel--phase_00_infra_man_pvc_name
              model_dir:
                runtimeValue:
                  constant: final_model
              model_name:
                componentInputParameter: pipelinechannel--phase_02_train_man_model
              namespace:
                componentInputParameter: pipelinechannel--phase_05_deploy_man_namespace
              tokenizer_mode:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_tokenizer_mode
          taskInfo:
            name: model-deployment
    inputDefinitions:
      artifacts:
        pipelinechannel--grpo-eval-output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--grpo-eval-output_reward_chart:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
        pipelinechannel--train-model-output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--train-model-output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--grpo-eval-promotion_passed:
          parameterType: BOOLEAN
        pipelinechannel--phase_00_infra_man_pvc_name:
          parameterType: STRING
        pipelinechannel--phase_02_train_man_model:
          parameterType: STRING
        pipelinechannel--phase_04_registry_man_address:
          parameterType: STRING
        pipelinechannel--phase_04_registry_man_name:
          parameterType: STRING
        pipelinechannel--phase_04_registry_man_version:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_author:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_description:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_format_name:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_format_version:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_port:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_man_namespace:
          parameterType: STRING
        pipelinechannel--phase_05_deploy_opt_cpu_requests:
          parameterType: STRING
        pipelinechannel--phase_05_deploy_opt_gpu_count:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_max_model_len:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_max_replicas:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_memory_requests:
          parameterType: STRING
        pipelinechannel--phase_05_deploy_opt_min_replicas:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_tokenizer_mode:
          parameterType: STRING
  comp-grpo-eval:
    executorLabel: exec-grpo-eval
    inputDefinitions:
      parameters:
        training_results_path:
          description: 'Mounted path to ART''s

            ``checkpoints/training_results.json`` file.'
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_reward_chart:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        promotion_passed:
          parameterType: BOOLEAN
  comp-kubeflow-model-registry:
    executorLabel: exec-kubeflow-model-registry
    inputDefinitions:
      artifacts:
        eval_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Evaluation metrics from lm-eval.
          isOptional: true
        eval_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Full evaluation results JSON artifact.
          isOptional: true
        input_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Training metrics.
          isOptional: true
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Model artifact from training step.
          isOptional: true
      parameters:
        author:
          defaultValue: pipeline
          description: Author name for the model registration.
          isOptional: true
          parameterType: STRING
        model_description:
          defaultValue: ''
          description: Optional description for the model.
          isOptional: true
          parameterType: STRING
        model_format_name:
          defaultValue: pytorch
          description: Model format name (e.g. "pytorch", "onnx").
          isOptional: true
          parameterType: STRING
        model_format_version:
          defaultValue: '1.0'
          description: Model format version.
          isOptional: true
          parameterType: STRING
        model_name:
          defaultValue: fine-tuned-model
          description: Name for the registered model.
          isOptional: true
          parameterType: STRING
        model_pvc_name:
          defaultValue: ''
          description: Name of the persistent PVC containing the model.
          isOptional: true
          parameterType: STRING
        model_version:
          defaultValue: 1.0.0
          description: Version string for the model (e.g. "1.0.0").
          isOptional: true
          parameterType: STRING
        pvc_mount_path:
          description: PVC mount path for workspace storage.
          parameterType: STRING
        registry_address:
          defaultValue: ''
          description: Model Registry server address (hostname or IP).
          isOptional: true
          parameterType: STRING
        registry_port:
          defaultValue: 8080.0
          description: 'Model Registry server port (default: 8080).'
          isOptional: true
          parameterType: NUMBER_INTEGER
        shared_log_file:
          defaultValue: pipeline_log.txt
          description: Filename for shared pipeline log.
          isOptional: true
          parameterType: STRING
        source_namespace:
          defaultValue: ''
          description: Namespace where pipeline runs (auto-detected if empty).
          isOptional: true
          parameterType: STRING
        source_pipeline_name:
          defaultValue: ''
          description: Name of the source KFP pipeline.
          isOptional: true
          parameterType: STRING
        source_pipeline_run_id:
          defaultValue: ''
          description: Unique ID of the pipeline run.
          isOptional: true
          parameterType: STRING
        source_pipeline_run_name:
          defaultValue: ''
          description: Display name of the pipeline run.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-model-deployment:
    executorLabel: exec-model-deployment
    inputDefinitions:
      parameters:
        cpu_limits:
          defaultValue: '2'
          description: CPU limits for the predictor pod.
          isOptional: true
          parameterType: STRING
        cpu_requests:
          defaultValue: '2'
          description: CPU requests for the predictor pod.
          isOptional: true
          parameterType: STRING
        force_recreate:
          defaultValue: false
          description: 'If True, delete and recreate the InferenceService

            (causes downtime). If False (default), patch in place.'
          isOptional: true
          parameterType: BOOLEAN
        genai_use_case:
          defaultValue: ''
          description: 'Tasks performed by the deployed model, shown as the

            Use case field in the RHOAI Model deployment details page. Examples

            include chat, multimodal, and natural language processing. Leave

            empty to omit the annotation.'
          isOptional: true
          parameterType: STRING
        gpu_count:
          defaultValue: 1.0
          description: Number of GPUs per replica.
          isOptional: true
          parameterType: NUMBER_INTEGER
        hardware_profile_name:
          defaultValue: gpu-profile
          description: HardwareProfile CR name for GPU resources.
          isOptional: true
          parameterType: STRING
        hardware_profile_namespace:
          defaultValue: redhat-ods-applications
          description: Namespace of the HardwareProfile CR.
          isOptional: true
          parameterType: STRING
        max_model_len:
          defaultValue: 4096.0
          description: Maximum context length (limits KV cache memory usage).
          isOptional: true
          parameterType: NUMBER_INTEGER
        max_replicas:
          defaultValue: 1.0
          description: Maximum number of replicas.
          isOptional: true
          parameterType: NUMBER_INTEGER
        memory_limits:
          defaultValue: 8Gi
          description: Memory limits for the predictor pod.
          isOptional: true
          parameterType: STRING
        memory_requests:
          defaultValue: 8Gi
          description: Memory requests for the predictor pod.
          isOptional: true
          parameterType: STRING
        min_replicas:
          defaultValue: 1.0
          description: Minimum number of replicas.
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_cache_pvc:
          description: Name of the PVC containing cached model weights.
          parameterType: STRING
        model_dir:
          description: Sub-path on the PVC where model files are stored (output from
            download_model).
          parameterType: STRING
        model_name:
          description: HuggingFace model name (e.g. 'mistralai/Mistral-7B-Instruct-v0.3').
          parameterType: STRING
        namespace:
          description: Namespace to deploy into.
          parameterType: STRING
        tokenizer_mode:
          defaultValue: auto
          description: 'vLLM tokenizer mode. Supported values are ``auto``

            (use the fast tokenizer when available), ``slow`` (force the

            HuggingFace slow tokenizer), and ``mistral`` (use the

            ``mistral_common`` tokenizer).'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
          description: Input training dataset artifact (tool-call traces).
          isOptional: true
      parameters:
        kubernetes_config:
          description: KFP TaskConfig for volumes/env/resources passthrough.
          isOptional: true
          parameterType: TASK_CONFIG
        pvc_path:
          description: Workspace PVC root path (use dsl.WORKSPACE_PATH_PLACEHOLDER).
          parameterType: STRING
        training_base_model:
          defaultValue: Qwen/Qwen3-4B
          description: Base model (HuggingFace ID or local path).
          isOptional: true
          parameterType: STRING
        training_data_config:
          defaultValue: Qwen3
          description: Dataset config name for HuggingFace datasets (e.g., Qwen3).
          isOptional: true
          parameterType: STRING
        training_data_path:
          defaultValue: ''
          description: 'Dataset path or HuggingFace ID (e.g.,

            Agent-Ark/Toucan-1.5M). When empty, uses the dataset artifact.

            When set, overrides the artifact.'
          isOptional: true
          parameterType: STRING
        training_enforce_eager:
          defaultValue: true
          description: Disable torch.compile/CUDAGraphs in vLLM (Qwen3 workaround).
          isOptional: true
          parameterType: BOOLEAN
        training_envs:
          defaultValue: ''
          description: Environment overrides as KEY=VAL,KEY=VAL.
          isOptional: true
          parameterType: STRING
        training_gpu_memory_utilization:
          defaultValue: 0.45
          description: Fraction of GPU memory for vLLM (rest for training).
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_group_size:
          defaultValue: 4.0
          description: Number of rollouts per prompt for GRPO advantage estimation.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_learning_rate:
          description: 'Learning rate (default: 1e-5).'
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_lora_alpha:
          defaultValue: 8.0
          description: LoRA scaling factor.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_lora_r:
          defaultValue: 16.0
          description: LoRA rank (controls adapter capacity).
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_metadata_annotations:
          defaultValue: ''
          description: Pod annotations as key=value,key=value.
          isOptional: true
          parameterType: STRING
        training_metadata_labels:
          defaultValue: ''
          description: Pod labels as key=value,key=value.
          isOptional: true
          parameterType: STRING
        training_n_train:
          defaultValue: 200.0
          description: Number of training samples to use from the dataset.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_num_iterations:
          defaultValue: 5.0
          description: Number of GRPO training iterations.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_prompt_batch_size:
          defaultValue: 50.0
          description: Number of prompts per training batch.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_pvc_name:
          defaultValue: ''
          description: PVC name to mount on the TrainJob pod for shared storage.
          isOptional: true
          parameterType: STRING
        training_resource_cpu_per_worker:
          defaultValue: '4'
          description: CPU cores per worker.
          isOptional: true
          parameterType: STRING
        training_resource_gpu_per_worker:
          defaultValue: 1.0
          description: GPUs per worker (should be 1 for ART).
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_resource_memory_per_worker:
          defaultValue: 64Gi
          description: Memory per worker (e.g., 64Gi).
          isOptional: true
          parameterType: STRING
        training_run_id:
          defaultValue: ''
          description: 'Unique identifier for this pipeline run. The pipeline

            supplies the KFP run ID so checkpoints from previous runs are not

            resumed accidentally on a persistent PVC. If empty, a UUID is used.'
          isOptional: true
          parameterType: STRING
        training_runtime:
          defaultValue: training-hub
          description: Name of the ClusterTrainingRuntime to use.
          isOptional: true
          parameterType: STRING
        training_use_hf_direct:
          defaultValue: false
          description: 'Use the Hugging Face dataset loader directly.

            When true, training_data_path must be an ``hf://`` URI or a Hugging

            Face repository ID; the dataset materialization task is bypassed.'
          isOptional: true
          parameterType: BOOLEAN
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
    taskConfigPassthroughs:
    - field: RESOURCES
    - field: KUBERNETES_TOLERATIONS
    - field: KUBERNETES_NODE_SELECTOR
    - field: KUBERNETES_AFFINITY
    - applyToTask: true
      field: ENV
    - applyToTask: true
      field: KUBERNETES_VOLUMES
deploymentSpec:
  executors:
    exec-grpo-eval:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - grpo_eval
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location --index-url https://pypi.org/simple\
          \ --trusted-host https://pypi.org/simple 'kfp==2.16.1' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef grpo_eval(\n    training_results_path: str,\n    output_metrics:\
          \ dsl.Output[dsl.Metrics],\n    output_reward_chart: dsl.Output[dsl.HTML],\n\
          ) -> NamedTuple(\"GrpoEvalOutputs\", [(\"promotion_passed\", bool)]):\n\
          \    \"\"\"Evaluate GRPO training results from the shared pipeline workspace.\n\
          \n    Reads ART's ``training_results.json`` from the caller-provided shared-PVC\
          \ path. The\n    GRPO pipeline supplies ``{workspace_path}/checkpoints/training_results.json``,\
          \ while\n    the complete path input keeps the component independent of\
          \ the PVC mount location.\n\n    Required JSON fields are ``final_mean_reward``,\
          \ ``reward_history``,\n    ``full_match_history``, and ``timing_history``.\
          \ The final reward and every history\n    entry must be a finite number.\
          \ Reward and full-match histories must have the same\n    number of iterations.\
          \ The logged ``mean_reward`` is ART's reported final aggregate\n    reward,\
          \ while ``final_reward`` is the last entry in ``reward_history`` used for\
          \ the\n    promotion comparison.\n\n    Args:\n        training_results_path:\
          \ Mounted path to ART's\n            ``checkpoints/training_results.json``\
          \ file.\n        output_metrics: KFP Metrics artifact receiving the GRPO\
          \ scalar metrics.\n        output_reward_chart: KFP HTML artifact containing\
          \ mean reward by training\n            iteration.\n\n    Returns:\n    \
          \    Named output ``promotion_passed``. It is true only when the final reward\
          \ is\n        strictly greater than the initial reward. A single reward\
          \ value does not\n        demonstrate improvement and returns false.\n\n\
          \    Raises:\n        FileNotFoundError: If ``training_results_path`` does\
          \ not exist.\n        ValueError: If the path is empty, the file is invalid\
          \ JSON, or required result\n            fields do not satisfy the provisional\
          \ contract.\n    \"\"\"\n    import json\n    import math\n\n    def require_finite_number(value:\
          \ object, field_name: str) -> float:\n        \"\"\"Return a JSON number\
          \ as a float or raise a field-specific error.\"\"\"\n        if isinstance(value,\
          \ bool) or not isinstance(value, (int, float)):\n            raise ValueError(f\"\
          '{field_name}' must be a finite number\")\n\n        number = float(value)\n\
          \        if not math.isfinite(number):\n            raise ValueError(f\"\
          '{field_name}' must be a finite number\")\n        return number\n\n   \
          \ def write_reward_chart(rewards: list[float], path: str) -> None:\n   \
          \     \"\"\"Write a self-contained SVG reward curve as a KFP HTML artifact.\"\
          \"\"\n        chart_width, chart_height, margin = 800, 400, 70\n       \
          \ plot_width = chart_width - 2 * margin\n        plot_height = chart_height\
          \ - 2 * margin\n        reward_min, reward_max = min(rewards), max(rewards)\n\
          \        reward_range = reward_max - reward_min\n        padding = reward_range\
          \ * 0.05 if reward_range else max(abs(reward_min) * 0.05, 0.05)\n      \
          \  y_min, y_max = reward_min - padding, reward_max + padding\n        if\
          \ not all(math.isfinite(value) for value in (reward_range, y_min, y_max)):\n\
          \            raise ValueError(\"'reward_history' range is too large to render\"\
          )\n\n        def x_coordinate(index: int) -> float:\n            if len(rewards)\
          \ == 1:\n                return margin + plot_width / 2\n            return\
          \ margin + index * plot_width / (len(rewards) - 1)\n\n        def y_coordinate(reward:\
          \ float) -> float:\n            return margin + (y_max - reward) * plot_height\
          \ / (y_max - y_min)\n\n        y_ticks = \"\".join(\n            f'<line\
          \ class=\"grid\" x1=\"{margin}\" y1=\"{margin + tick * plot_height / 4:.2f}\"\
          \ '\n            f'x2=\"{chart_width - margin}\" y2=\"{margin + tick * plot_height\
          \ / 4:.2f}\" />'\n            f'<text x=\"{margin - 12}\" y=\"{margin +\
          \ tick * plot_height / 4 + 5:.2f}\" '\n            f'text-anchor=\"end\"\
          >{y_max - tick * (y_max - y_min) / 4:.6g}</text>'\n            for tick\
          \ in range(5)\n        )\n        x_tick_count = min(len(rewards), 10)\n\
          \        x_tick_indices = {\n            round(tick * (len(rewards) - 1)\
          \ / (x_tick_count - 1)) if x_tick_count > 1 else 0\n            for tick\
