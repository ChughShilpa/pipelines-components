          \ with at least one assistant tool_calls entry\n        \"\"\"\n       \
          \ if len(dataset) == 0:\n            raise ValueError(\"Dataset is empty\"\
          )\n\n        num_to_check = min(100, len(dataset))\n        first = dataset[0]\n\
          \n        # Detect format from first sample (use .get() because Arrow-backed\n\
          \        # datasets always contain all columns; missing values are None)\n\
          \        is_single_turn = bool(_get_target_tool_value(first)) and bool(first.get(\"\
          question\"))\n        first_messages = first.get(\"messages\", None)\n \
          \       is_multi_turn = (\n            isinstance(first_messages, list)\
          \ and len(first_messages) > 0 and _has_tool_calls_in_messages(first_messages)\n\
          \        )\n\n        if not is_single_turn and not is_multi_turn:\n   \
          \         raise ValueError(\n                f\"Item 0 does not match any\
          \ supported tool-call format. \"\n                f\"Expected either (1)\
          \ single-turn with a target-tool field \"\n                f\"({' or '.join(_TARGET_TOOL_FIELDS)})\
          \ and 'question' fields, \"\n                f\"or (2) multi-turn with 'messages'\
          \ containing assistant tool_calls. \"\n                f\"Found keys: {list(first.keys())}\"\
          \n            )\n\n        if is_single_turn and is_multi_turn:\n      \
          \      log_message(\n                \"Item 0 matches both single-turn and\
          \ multi-turn tool-call formats; using single-turn validation\"\n       \
          \     )\n\n        if is_single_turn:\n            for i in range(num_to_check):\n\
          \                item = dataset[i]\n                if not _get_target_tool_value(item):\n\
          \                    raise ValueError(\n                        f\"Item\
          \ {i}: none of {_TARGET_TOOL_FIELDS} is present or non-empty. \"\n     \
          \                   f\"All samples must be single-turn format (detected\
          \ from first sample).\"\n                    )\n                if not item.get(\"\
          question\"):\n                    raise ValueError(\n                  \
          \      f\"Item {i}: 'question' is missing or empty. \"\n               \
          \         f\"All samples must be single-turn format (detected from first\
          \ sample).\"\n                    )\n            log_message(\n        \
          \        f\"Dataset validated: checked {num_to_check} of {len(dataset)}\
          \ examples \"\n                f\"in tool-call format (single-turn)\"\n\
          \            )\n        else:\n            for i in range(num_to_check):\n\
          \                item = dataset[i]\n                messages = item.get(\"\
          messages\", None)\n                if not isinstance(messages, list) or\
          \ len(messages) == 0:\n                    raise ValueError(\n         \
          \               f\"Item {i}: 'messages' must be a non-empty list. \"\n \
          \                       f\"All samples must be multi-turn format (detected\
          \ from first sample).\"\n                    )\n                if not _has_tool_calls_in_messages(messages):\n\
          \                    raise ValueError(\n                        f\"Item\
          \ {i}: no assistant message with 'tool_calls' found in 'messages'. \"\n\
          \                        f\"All samples must be multi-turn format (detected\
          \ from first sample).\"\n                    )\n            log_message(\n\
          \                f\"Dataset validated: checked {num_to_check} of {len(dataset)}\
          \ examples in tool-call format (multi-turn)\"\n            )\n\n       \
          \ return True\n\n    def split_hf_id_and_config(dataset_path: str) -> tuple[str,\
          \ str | None]:\n        \"\"\"Split an HF dataset identifier into (id, config)\
          \ if a config suffix is provided.\n\n        Examples:\n            \"LipengCS/Table-GPT:All\"\
          \ -> (\"LipengCS/Table-GPT\", \"All\")\n            \"bigcode/the-stack-dedup-python\"\
          \ -> (\"bigcode/the-stack-dedup-python\", None)\n        \"\"\"\n      \
          \  if \":\" in dataset_path:\n            base, cfg = dataset_path.split(\"\
          :\", 1)\n            return base, (cfg or None)\n        return dataset_path,\
          \ None\n\n    def download_from_huggingface(dataset_path: str) -> Dataset:\n\
          \        \"\"\"Download dataset from HuggingFace.\"\"\"\n        ds_id,\
          \ ds_config = split_hf_id_and_config(dataset_path)\n        if ds_config:\n\
          \            log_message(f\"Downloading from HuggingFace: {ds_id} (config:\
          \ {ds_config})\")\n        else:\n            log_message(f\"Downloading\
          \ from HuggingFace: {ds_id}\")\n\n        # Set up authentication if token\
          \ provided via environment\n        if hf_token:\n            log_message(\"\
          Using HF_TOKEN from environment for Hugging Face authentication\")\n   \
          \     else:\n            import logging as _logging\n\n            pretty_id\
          \ = f\"{ds_id}:{ds_config}\" if ds_config else ds_id\n            _logging.warning(\n\
          \                \"HF_TOKEN is not set; attempting to download Hugging Face\
          \ dataset \"\n                f\"'{pretty_id}' without authentication. \"\
          \n                \"Only public, non-gated datasets can be downloaded. \"\
          \n                \"If you need access to gated datasets, configure the\
          \ 'hf-token' Kubernetes \"\n                \"secret so HF_TOKEN is available\
