# PIPELINE DEFINITION
# Name: lora-grpo-pipeline
# Description: LoRA GRPO pipeline: reinforcement learning from verifiable rewards using ART backend on a single GPU TrainJob
# Inputs:
#    phase_00_infra_man_pvc_name: str
#    phase_01_dataset_man_data_split: float [Default: 1.0]
#    phase_01_dataset_man_data_uri: str [Default: 'hf://Agent-Ark/Toucan-1.5M:Qwen3']
#    phase_01_dataset_opt_subset: int [Default: 0.0]
#    phase_02_train_man_group_size: int [Default: 4.0]
#    phase_02_train_man_lora_alpha: int [Default: 16.0]
#    phase_02_train_man_lora_r: int [Default: 16.0]
#    phase_02_train_man_model: str [Default: 'Qwen/Qwen3-4B']
#    phase_02_train_man_num_iterations: int [Default: 50.0]
#    phase_02_train_man_prompt_batch_size: int [Default: 50.0]
#    phase_02_train_opt_annotations: str [Default: '']
#    phase_02_train_opt_cpu: str [Default: '4']
#    phase_02_train_opt_data_config: str [Default: 'Qwen3']
#    phase_02_train_opt_enforce_eager: bool [Default: True]
#    phase_02_train_opt_env_vars: str [Default: '']
#    phase_02_train_opt_gpu: int [Default: 1.0]
#    phase_02_train_opt_gpu_memory_utilization: float [Default: 0.45]
#    phase_02_train_opt_labels: str [Default: '']
#    phase_02_train_opt_learning_rate: float [Default: 1e-05]
#    phase_02_train_opt_memory: str [Default: '64Gi']
#    phase_02_train_opt_n_train: int [Default: 200.0]
#    phase_02_train_opt_runtime: str [Default: 'training-hub']
#    phase_04_registry_man_address: str
#    phase_04_registry_man_name: str [Default: 'grpo-model']
#    phase_04_registry_man_version: str [Default: '1.0.0']
#    phase_04_registry_opt_author: str [Default: 'pipeline']
#    phase_04_registry_opt_description: str [Default: '']
#    phase_04_registry_opt_format_name: str [Default: 'pytorch']
#    phase_04_registry_opt_format_version: str [Default: '1.0']
#    phase_04_registry_opt_port: int [Default: 8080.0]
#    phase_05_deploy_man_namespace: str
#    phase_05_deploy_opt_cpu_requests: str [Default: '2']
#    phase_05_deploy_opt_gpu_count: int [Default: 1.0]
#    phase_05_deploy_opt_max_model_len: int [Default: 4096.0]
#    phase_05_deploy_opt_max_replicas: int [Default: 1.0]
#    phase_05_deploy_opt_memory_requests: str [Default: '8Gi']
#    phase_05_deploy_opt_min_replicas: int [Default: 1.0]
#    phase_05_deploy_opt_tokenizer_mode: str [Default: 'auto']
components:
  comp-condition-1:
    dag:
      tasks:
        kubeflow-model-registry:
          cachingOptions: {}
          componentRef:
            name: comp-kubeflow-model-registry
          inputs:
            artifacts:
              eval_metrics:
                componentInputArtifact: pipelinechannel--grpo-eval-output_metrics
              eval_results:
                componentInputArtifact: pipelinechannel--grpo-eval-output_reward_chart
              input_metrics:
                componentInputArtifact: pipelinechannel--train-model-output_metrics
              input_model:
                componentInputArtifact: pipelinechannel--train-model-output_model
            parameters:
              author:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_author
              model_description:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_description
              model_format_name:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_format_name
              model_format_version:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_format_version
              model_name:
                componentInputParameter: pipelinechannel--phase_04_registry_man_name
              model_pvc_name:
                componentInputParameter: pipelinechannel--phase_00_infra_man_pvc_name
              model_version:
                componentInputParameter: pipelinechannel--phase_04_registry_man_version
              pvc_mount_path:
                runtimeValue:
                  constant: /mnt/pipeline
              registry_address:
                componentInputParameter: pipelinechannel--phase_04_registry_man_address
              registry_port:
                componentInputParameter: pipelinechannel--phase_04_registry_opt_port
              shared_log_file:
                runtimeValue:
                  constant: pipeline_log.txt
              source_namespace:
                runtimeValue:
                  constant: ''
              source_pipeline_name:
                runtimeValue:
                  constant: lora-grpo-pipeline
              source_pipeline_run_id:
                runtimeValue:
                  constant: '{{$.pipeline_job_uuid}}'
              source_pipeline_run_name:
                runtimeValue:
                  constant: '{{$.pipeline_job_name}}'
          taskInfo:
            name: kubeflow-model-registry
        model-deployment:
          cachingOptions: {}
          componentRef:
            name: comp-model-deployment
          dependentTasks:
          - kubeflow-model-registry
          inputs:
            parameters:
              cpu_limits:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_cpu_requests
              cpu_requests:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_cpu_requests
              gpu_count:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_gpu_count
              max_model_len:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_max_model_len
              max_replicas:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_max_replicas
              memory_limits:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_memory_requests
              memory_requests:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_memory_requests
              min_replicas:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_min_replicas
              model_cache_pvc:
                componentInputParameter: pipelinechannel--phase_00_infra_man_pvc_name
              model_dir:
                runtimeValue:
                  constant: final_model
              model_name:
                componentInputParameter: pipelinechannel--phase_02_train_man_model
              namespace:
                componentInputParameter: pipelinechannel--phase_05_deploy_man_namespace
              tokenizer_mode:
                componentInputParameter: pipelinechannel--phase_05_deploy_opt_tokenizer_mode
          taskInfo:
            name: model-deployment
    inputDefinitions:
      artifacts:
        pipelinechannel--grpo-eval-output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--grpo-eval-output_reward_chart:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
        pipelinechannel--train-model-output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        pipelinechannel--train-model-output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--grpo-eval-promotion_passed:
          parameterType: BOOLEAN
        pipelinechannel--phase_00_infra_man_pvc_name:
          parameterType: STRING
        pipelinechannel--phase_02_train_man_model:
          parameterType: STRING
        pipelinechannel--phase_04_registry_man_address:
          parameterType: STRING
        pipelinechannel--phase_04_registry_man_name:
          parameterType: STRING
        pipelinechannel--phase_04_registry_man_version:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_author:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_description:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_format_name:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_format_version:
          parameterType: STRING
        pipelinechannel--phase_04_registry_opt_port:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_man_namespace:
          parameterType: STRING
        pipelinechannel--phase_05_deploy_opt_cpu_requests:
          parameterType: STRING
        pipelinechannel--phase_05_deploy_opt_gpu_count:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_max_model_len:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_max_replicas:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_memory_requests:
          parameterType: STRING
        pipelinechannel--phase_05_deploy_opt_min_replicas:
          parameterType: NUMBER_INTEGER
        pipelinechannel--phase_05_deploy_opt_tokenizer_mode:
          parameterType: STRING
  comp-dataset-download:
    executorLabel: exec-dataset-download
    inputDefinitions:
      parameters:
        dataset_format:
          defaultValue: chat
          description: Validation format - "chat" (default) or "tool_call"
          isOptional: true
          parameterType: STRING
        dataset_uri:
          description: Dataset URI (hf://, s3://, https://, pvc:// or absolute path)
          parameterType: STRING
        pvc_mount_path:
          description: Path where the shared PVC is mounted
          parameterType: STRING
        shared_log_file:
          defaultValue: pipeline_log.txt
          description: Name of the shared log file
          isOptional: true
          parameterType: STRING
        subset_count:
          defaultValue: 0.0
          description: Number of examples to use (0 = use all)
          isOptional: true
          parameterType: NUMBER_INTEGER
        train_split_ratio:
          defaultValue: 0.9
          description: Train/eval split (0.9 = 90%/10%, 1.0 = no split, all for training)
          isOptional: true
          parameterType: NUMBER_DOUBLE
        write_kfp_artifacts:
          defaultValue: true
          description: 'Whether to write full dataset files to the KFP

            artifact paths. Set to False when downstream tasks consume the

            PVC path directly; the KFP outputs then contain only a small

            manifest.'
          isOptional: true
          parameterType: BOOLEAN
    outputDefinitions:
      artifacts:
        eval_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-grpo-eval:
    executorLabel: exec-grpo-eval
    inputDefinitions:
      parameters:
        training_results_path:
          description: 'Mounted path to ART''s

            ``checkpoints/training_results.json`` file.'
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_reward_chart:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
      parameters:
        promotion_passed:
          parameterType: BOOLEAN
  comp-kubeflow-model-registry:
    executorLabel: exec-kubeflow-model-registry
    inputDefinitions:
      artifacts:
        eval_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Evaluation metrics from lm-eval.
          isOptional: true
        eval_results:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
          description: Full evaluation results JSON artifact.
          isOptional: true
        input_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
          description: Training metrics.
          isOptional: true
        input_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
          description: Model artifact from training step.
          isOptional: true
      parameters:
        author:
          defaultValue: pipeline
          description: Author name for the model registration.
          isOptional: true
          parameterType: STRING
        model_description:
          defaultValue: ''
          description: Optional description for the model.
          isOptional: true
          parameterType: STRING
        model_format_name:
          defaultValue: pytorch
          description: Model format name (e.g. "pytorch", "onnx").
          isOptional: true
          parameterType: STRING
        model_format_version:
          defaultValue: '1.0'
          description: Model format version.
          isOptional: true
          parameterType: STRING
        model_name:
          defaultValue: fine-tuned-model
          description: Name for the registered model.
          isOptional: true
          parameterType: STRING
        model_pvc_name:
          defaultValue: ''
          description: Name of the persistent PVC containing the model.
          isOptional: true
          parameterType: STRING
        model_version:
          defaultValue: 1.0.0
          description: Version string for the model (e.g. "1.0.0").
          isOptional: true
          parameterType: STRING
        pvc_mount_path:
          description: PVC mount path for workspace storage.
          parameterType: STRING
        registry_address:
          defaultValue: ''
          description: Model Registry server address (hostname or IP).
          isOptional: true
          parameterType: STRING
        registry_port:
          defaultValue: 8080.0
          description: 'Model Registry server port (default: 8080).'
          isOptional: true
          parameterType: NUMBER_INTEGER
        shared_log_file:
          defaultValue: pipeline_log.txt
          description: Filename for shared pipeline log.
          isOptional: true
          parameterType: STRING
        source_namespace:
          defaultValue: ''
          description: Namespace where pipeline runs (auto-detected if empty).
          isOptional: true
          parameterType: STRING
        source_pipeline_name:
          defaultValue: ''
          description: Name of the source KFP pipeline.
          isOptional: true
          parameterType: STRING
        source_pipeline_run_id:
          defaultValue: ''
          description: Unique ID of the pipeline run.
          isOptional: true
          parameterType: STRING
        source_pipeline_run_name:
          defaultValue: ''
          description: Display name of the pipeline run.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-model-deployment:
    executorLabel: exec-model-deployment
    inputDefinitions:
      parameters:
        cpu_limits:
          defaultValue: '2'
          description: CPU limits for the predictor pod.
          isOptional: true
          parameterType: STRING
        cpu_requests:
          defaultValue: '2'
          description: CPU requests for the predictor pod.
          isOptional: true
          parameterType: STRING
        force_recreate:
          defaultValue: false
          description: 'If True, delete and recreate the InferenceService

            (causes downtime). If False (default), patch in place.'
          isOptional: true
          parameterType: BOOLEAN
        genai_use_case:
          defaultValue: ''
          description: 'Tasks performed by the deployed model, shown as the

            Use case field in the RHOAI Model deployment details page. Examples

            include chat, multimodal, and natural language processing. Leave

            empty to omit the annotation.'
          isOptional: true
          parameterType: STRING
        gpu_count:
          defaultValue: 1.0
          description: Number of GPUs per replica.
          isOptional: true
          parameterType: NUMBER_INTEGER
        hardware_profile_name:
          defaultValue: gpu-profile
          description: HardwareProfile CR name for GPU resources.
          isOptional: true
          parameterType: STRING
        hardware_profile_namespace:
          defaultValue: redhat-ods-applications
          description: Namespace of the HardwareProfile CR.
          isOptional: true
          parameterType: STRING
        max_model_len:
          defaultValue: 4096.0
          description: Maximum context length (limits KV cache memory usage).
          isOptional: true
          parameterType: NUMBER_INTEGER
        max_replicas:
          defaultValue: 1.0
          description: Maximum number of replicas.
          isOptional: true
          parameterType: NUMBER_INTEGER
        memory_limits:
          defaultValue: 8Gi
          description: Memory limits for the predictor pod.
          isOptional: true
          parameterType: STRING
        memory_requests:
          defaultValue: 8Gi
          description: Memory requests for the predictor pod.
          isOptional: true
          parameterType: STRING
        min_replicas:
          defaultValue: 1.0
          description: Minimum number of replicas.
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_cache_pvc:
          description: Name of the PVC containing cached model weights.
          parameterType: STRING
        model_dir:
          description: Sub-path on the PVC where model files are stored (output from
            download_model).
          parameterType: STRING
        model_name:
          description: HuggingFace model name (e.g. 'mistralai/Mistral-7B-Instruct-v0.3').
          parameterType: STRING
        namespace:
          description: Namespace to deploy into.
          parameterType: STRING
        tokenizer_mode:
          defaultValue: auto
          description: 'vLLM tokenizer mode. Supported values are ``auto``

            (use the fast tokenizer when available), ``slow`` (force the

            HuggingFace slow tokenizer), and ``mistral`` (use the

            ``mistral_common`` tokenizer).'
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
          description: Input training dataset artifact (tool-call traces).
          isOptional: true
      parameters:
        kubernetes_config:
          description: KFP TaskConfig for volumes/env/resources passthrough.
          isOptional: true
          parameterType: TASK_CONFIG
        pvc_path:
          description: Workspace PVC root path (use dsl.WORKSPACE_PATH_PLACEHOLDER).
          parameterType: STRING
        training_base_model:
          defaultValue: Qwen/Qwen3-4B
          description: Base model (HuggingFace ID or local path).
          isOptional: true
          parameterType: STRING
        training_data_config:
          defaultValue: Qwen3
          description: Dataset config name for HuggingFace datasets (e.g., Qwen3).
          isOptional: true
          parameterType: STRING
        training_data_path:
          defaultValue: ''
          description: 'Dataset path or HuggingFace ID (e.g.,

            Agent-Ark/Toucan-1.5M). When empty, uses the dataset artifact.

            When set, overrides the artifact.'
          isOptional: true
          parameterType: STRING
        training_enforce_eager:
          defaultValue: true
          description: Disable torch.compile/CUDAGraphs in vLLM (Qwen3 workaround).
          isOptional: true
          parameterType: BOOLEAN
        training_envs:
          defaultValue: ''
          description: Environment overrides as KEY=VAL,KEY=VAL.
          isOptional: true
          parameterType: STRING
        training_gpu_memory_utilization:
          defaultValue: 0.45
          description: Fraction of GPU memory for vLLM (rest for training).
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_group_size:
          defaultValue: 4.0
          description: Number of rollouts per prompt for GRPO advantage estimation.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_learning_rate:
          description: 'Learning rate (default: 1e-5).'
          isOptional: true
          parameterType: NUMBER_DOUBLE
        training_lora_alpha:
          defaultValue: 8.0
          description: LoRA scaling factor.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_lora_r:
          defaultValue: 16.0
          description: LoRA rank (controls adapter capacity).
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_metadata_annotations:
          defaultValue: ''
          description: Pod annotations as key=value,key=value.
          isOptional: true
          parameterType: STRING
        training_metadata_labels:
          defaultValue: ''
          description: Pod labels as key=value,key=value.
          isOptional: true
          parameterType: STRING
        training_n_train:
          defaultValue: 200.0
          description: Number of training samples to use from the dataset.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_num_iterations:
          defaultValue: 5.0
          description: Number of GRPO training iterations.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_prompt_batch_size:
          defaultValue: 50.0
          description: Number of prompts per training batch.
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_pvc_name:
          defaultValue: ''
          description: PVC name to mount on the TrainJob pod for shared storage.
          isOptional: true
          parameterType: STRING
        training_resource_cpu_per_worker:
          defaultValue: '4'
          description: CPU cores per worker.
          isOptional: true
          parameterType: STRING
        training_resource_gpu_per_worker:
          defaultValue: 1.0
          description: GPUs per worker (should be 1 for ART).
          isOptional: true
          parameterType: NUMBER_INTEGER
        training_resource_memory_per_worker:
          defaultValue: 64Gi
          description: Memory per worker (e.g., 64Gi).
          isOptional: true
          parameterType: STRING
        training_run_id:
          defaultValue: ''
          description: 'Unique identifier for this pipeline run. The pipeline

            supplies the KFP run ID so checkpoints from previous runs are not

            resumed accidentally on a persistent PVC. If empty, a UUID is used.'
          isOptional: true
          parameterType: STRING
        training_runtime:
          defaultValue: training-hub
          description: Name of the ClusterTrainingRuntime to use.
          isOptional: true
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        output_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        Output:
          parameterType: STRING
    taskConfigPassthroughs:
    - field: RESOURCES
    - field: KUBERNETES_TOLERATIONS
    - field: KUBERNETES_NODE_SELECTOR
    - field: KUBERNETES_AFFINITY
    - applyToTask: true
      field: ENV
    - applyToTask: true
      field: KUBERNETES_VOLUMES
deploymentSpec:
  executors:
    exec-dataset-download:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - dataset_download
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'datasets>=2.14.0'\
          \ 'huggingface-hub>=0.20.0' 's3fs>=2023.1.0'  &&  python3 -m pip install\
          \ --quiet --no-warn-script-location 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef dataset_download(\n    train_dataset: dsl.Output[dsl.Dataset],\n\
          \    eval_dataset: dsl.Output[dsl.Dataset],\n    dataset_uri: str,\n   \
          \ pvc_mount_path: str,\n    train_split_ratio: float = 0.9,  # 1.0 = no\
          \ eval split (all data for training)\n    subset_count: int = 0,\n    dataset_format:\
          \ str = \"chat\",\n    shared_log_file: str = \"pipeline_log.txt\",\n  \
          \  write_kfp_artifacts: bool = True,\n):\n    \"\"\"Download and prepare\
          \ datasets from multiple sources.\n\n    Validates dataset format based\
          \ on the dataset_format parameter:\n    - \"chat\": Chat template format\
          \ (messages/conversations with role/content)\n    - \"tool_call\": Tool-call\
          \ format for GRPO training (single-turn or multi-turn traces)\n\n    Args:\n\
          \        train_dataset: Output artifact for training dataset (JSONL format)\n\
          \        eval_dataset: Output artifact for evaluation dataset (JSONL format)\n\
          \        dataset_uri: Dataset URI (hf://, s3://, https://, pvc:// or absolute\
          \ path)\n        pvc_mount_path: Path where the shared PVC is mounted\n\
          \        train_split_ratio: Train/eval split (0.9 = 90%/10%, 1.0 = no split,\
          \ all for training)\n        subset_count: Number of examples to use (0\
          \ = use all)\n        dataset_format: Validation format - \"chat\" (default)\
          \ or \"tool_call\"\n        shared_log_file: Name of the shared log file\n\
          \        write_kfp_artifacts: Whether to write full dataset files to the\
          \ KFP\n            artifact paths. Set to False when downstream tasks consume\
          \ the\n            PVC path directly; the KFP outputs then contain only\
          \ a small\n            manifest.\n    \"\"\"\n    import os\n\n    # Hugging\
          \ Face defaults to the container's local home/cache directories.\n    #\
          \ Those directories are backed by node ephemeral storage in KFP pods. Keep\n\
          \    # the complete dataset cache on the workspace PVC instead.\n    cache_root\
          \ = os.path.join(pvc_mount_path, \".cache\")\n    hf_home = os.path.join(cache_root,\
          \ \"huggingface\")\n    hf_datasets_cache = os.path.join(hf_home, \"datasets\"\
          )\n    tmp_root = os.path.join(pvc_mount_path, \".tmp\")\n    for path in\
          \ (cache_root, hf_home, hf_datasets_cache, tmp_root):\n        os.makedirs(path,\
          \ exist_ok=True)\n\n    os.environ.update(\n        {\n            \"HOME\"\
          : pvc_mount_path,\n            \"XDG_CACHE_HOME\": cache_root,\n       \
          \     \"HF_HOME\": hf_home,\n            \"HF_HUB_CACHE\": os.path.join(hf_home,\
          \ \"hub\"),\n            \"HF_DATASETS_CACHE\": hf_datasets_cache,\n   \
          \         \"HF_XET_CACHE\": os.path.join(hf_home, \"xet\"),\n          \
          \  \"HF_ASSETS_CACHE\": os.path.join(hf_home, \"assets\"),\n           \
          \ \"TMPDIR\": tmp_root,\n            \"TEMP\": tmp_root,\n            \"\
          TMP\": tmp_root,\n        }\n    )\n\n    from datasets import Dataset,\
          \ load_dataset\n\n    valid_formats = (\"chat\", \"tool_call\")\n    if\
          \ dataset_format not in valid_formats:\n        raise ValueError(f\"Unsupported\
          \ dataset_format: '{dataset_format}'. Must be one of {valid_formats}.\"\
          )\n\n    # Prefer HF_TOKEN from the environment (typically injected via\
          \ the `hf-token` Kubernetes secret).\n    # This keeps authentication configuration\
          \ in Kubernetes secrets instead of pipeline parameters.\n    hf_token =\
          \ (os.environ.get(\"HF_TOKEN\") or \"\").strip()\n\n    def log_message(msg:\
          \ str):\n        \"\"\"Log message to console and shared log file.\"\"\"\
          \n        print(msg)\n        log_path = os.path.join(pvc_mount_path, shared_log_file)\n\
          \        with open(log_path, \"a\") as f:\n            f.write(msg + \"\\\
          n\")\n\n    def parse_uri(uri: str) -> tuple[str, str]:\n        \"\"\"\
          Parse dataset URI to determine source type and path.\n\n        Args:\n\
          \            uri: Dataset URI with scheme. Supported formats:\n        \
          \        - HuggingFace: hf://dataset-name or dataset-name\n            \
          \    - S3/MinIO: s3://bucket/path/to/file.jsonl\n                - HTTP/HTTPS:\
          \ http://... or https://... (e.g., MinIO shared links)\n               \
          \ - Local/PVC: pvc://path/to/file.jsonl or /absolute/path/to/file.jsonl\n\
          \n        Returns:\n            Tuple of (source_type, path) where source_type\
          \ is 'hf', 's3', 'http', or 'local'\n        \"\"\"\n        uri = uri.strip()\n\
          \n        # Check for explicit schemes\n        if uri.startswith(\"http://\"\
          ) or uri.startswith(\"https://\"):\n            return (\"http\", uri)\n\
          \        elif uri.startswith(\"hf://\"):\n            return (\"hf\", uri[5:])\n\
          \        elif uri.startswith(\"s3://\"):\n            return (\"s3\", uri[5:])\n\
          \        elif uri.startswith(\"pvc://\"):\n            return (\"local\"\
          , uri[6:])\n        elif uri.startswith(\"/\"):\n            return (\"\
          local\", uri)\n        else:\n            # Default to HuggingFace if no\
          \ scheme\n            return (\"hf\", uri)\n\n    def validate_chat_format_dataset(dataset:\
          \ Dataset) -> bool:\n        \"\"\"Validate that dataset follows chat template\
          \ format.\n\n        Expected format:\n        - Each entry should have\
          \ 'messages' or 'conversations' field\n        - Messages should be a list\
          \ of dicts with 'role' and 'content'\n        - Roles should be from: 'system',\
          \ 'user', 'assistant', 'function', 'tool'\n        \"\"\"\n        if len(dataset)\
          \ == 0:\n            raise ValueError(\"Dataset is empty\")\n\n        valid_roles\
          \ = {\"system\", \"user\", \"assistant\", \"function\", \"tool\"}\n\n  \
          \      # Check first 100 examples (or fewer if dataset is smaller)\n   \
          \     num_to_check = min(100, len(dataset))\n\n        for i in range(num_to_check):\n\
          \            item = dataset[i]\n\n            # Check for common chat format\
          \ fields\n            if \"messages\" in item:\n                messages\
          \ = item[\"messages\"]\n            elif \"conversations\" in item:\n  \
          \              messages = item[\"conversations\"]\n            else:\n \
          \               raise ValueError(\n                    f\"Item {i} missing\
          \ 'messages' or 'conversations' field. Found keys: {list(item.keys())}\"\
          \n                )\n\n            if not isinstance(messages, list):\n\
          \                raise ValueError(f\"Item {i}: messages must be a list\"\
          )\n\n            for j, msg in enumerate(messages):\n                if\
          \ not isinstance(msg, dict):\n                    raise ValueError(f\"Item\
          \ {i}, message {j}: must be a dict\")\n\n                if \"role\" not\
          \ in msg or \"content\" not in msg:\n                    raise ValueError(f\"\
          Item {i}, message {j}: must have 'role' and 'content' fields\")\n\n    \
          \            if msg[\"role\"] not in valid_roles:\n                    raise\
          \ ValueError(\n                        f\"Item {i}, message {j}: invalid\
          \ role '{msg['role']}'. Must be one of {valid_roles}\"\n               \
          \     )\n\n        log_message(f\"Dataset validated: {len(dataset)} examples\
          \ in chat format\")\n        return True\n\n    def _has_tool_calls_in_messages(messages:\
          \ list) -> bool:\n        \"\"\"Check if any assistant message in the list\
          \ contains tool_calls.\"\"\"\n        for msg in messages:\n           \
          \ if not isinstance(msg, dict) or msg.get(\"role\") != \"assistant\":\n\
          \                continue\n            tool_calls = msg.get(\"tool_calls\"\
          )\n            if isinstance(tool_calls, list) and tool_calls:\n       \
          \         return True\n        return False\n\n    # Field name aliases\
          \ accepted for the single-turn target-tool indicator.\n    # 'target_tool_name'\
          \ is the canonical singular field; 'target_tools' is a\n    # common plural/list\
          \ variant used by some tool-calling datasets (e.g.,\n    # Agent-Ark/Toucan-1.5M)\
          \ to record one or more seed tools per example.\n    _TARGET_TOOL_FIELDS\
          \ = (\"target_tool_name\", \"target_tools\")\n\n    def _get_target_tool_value(item:\
          \ dict):\n        \"\"\"Return the first non-empty target-tool field value,\
          \ checking known aliases.\"\"\"\n        for field in _TARGET_TOOL_FIELDS:\n\
          \            value = item.get(field)\n            if value:\n          \
          \      return value\n        return None\n\n    def validate_tool_call_format_dataset(dataset:\
          \ Dataset) -> bool:\n        \"\"\"Validate that dataset follows tool-call\
          \ format for GRPO training.\n\n        Detects format from the first sample\
          \ and validates all checked samples match:\n        - Single-turn: each\
