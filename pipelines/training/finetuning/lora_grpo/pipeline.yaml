          \     \"group_size\": int(training_group_size),\n            \"prompt_batch_size\"\
          : int(training_prompt_batch_size),\n            \"n_train\": int(training_n_train),\n\
          \            \"learning_rate\": float(training_learning_rate if training_learning_rate\
          \ is not None else 1e-5),\n            \"gpu_memory_utilization\": float(training_gpu_memory_utilization),\n\
          \            \"enforce_eager\": bool(training_enforce_eager),\n        \
          \    \"lora_r\": int(training_lora_r),\n            \"lora_alpha\": int(training_lora_alpha),\n\
          \        }\n        if training_data_config:\n            params[\"data_config\"\
          ] = training_data_config\n        if data_path:\n            params[\"data_path\"\
          ] = data_path\n\n        # Build pod-spec patch for /dev/shm and workspace\
          \ PVC\n        vols, vmts = [], []\n        if kubernetes_config and getattr(kubernetes_config,\
          \ \"volumes\", None):\n            vols.extend(kubernetes_config.volumes)\n\
          \        if kubernetes_config and getattr(kubernetes_config, \"volume_mounts\"\
          , None):\n            vmts.extend(kubernetes_config.volume_mounts)\n\n \
          \       tlbl = parse_kv(training_metadata_labels)\n        tann = parse_kv(training_metadata_annotations)\n\
          \n        def _pod_spec():\n            shm_vol = {\"name\": \"dshm\", \"\
          emptyDir\": {\"medium\": \"Memory\"}}\n            shm_mount = {\"name\"\
          : \"dshm\", \"mountPath\": \"/dev/shm\"}\n            all_vols = [shm_vol]\
          \ + vols\n            # The pipeline task may already mount a PVC at pvc_path\
          \ through\n            # kubernetes_config. If training_pvc_name is provided,\
          \ it is the\n            # authoritative PVC for the TrainJob worker. Remove\
          \ the inherited\n            # mount at this path before adding the user-provided\
          \ PVC so the\n            # JobSet does not contain duplicate volumeMount\
          \ entries.\n            if training_pvc_name:\n                inherited_mounts\
          \ = [\n                    mount\n                    for mount in vmts\n\
          \                    if (mount.get(\"mountPath\") if isinstance(mount, dict)\
          \ else getattr(mount, \"mount_path\", None))\n                    != pvc_path\n\
          \                ]\n                if len(inherited_mounts) != len(vmts):\n\
          \                    log.info(\n                        \"Replacing inherited\
          \ PVC mount at %s with training PVC %s\",\n                        pvc_path,\n\
          \                        training_pvc_name,\n                    )\n   \
          \             vmts_for_trainjob = inherited_mounts\n            else:\n\
          \                vmts_for_trainjob = vmts\n\n            all_mounts = [shm_mount]\
          \ + vmts_for_trainjob\n            if training_pvc_name:\n             \
          \   all_vols.append({\"name\": \"workspace\", \"persistentVolumeClaim\"\
          : {\"claimName\": training_pvc_name}})\n                all_mounts.append({\"\
          name\": \"workspace\", \"mountPath\": pvc_path})\n                # Keep\
          \ the HF token out of the TrainJob environment and mount\n             \
          \   # it as a file instead. The secret is optional for public\n        \
          \        # models and is never included in logs or resource specs.\n   \
          \             all_vols.append(\n                    {\n                \
          \        \"name\": \"hf-token\",\n                        \"secret\": {\"\
          secretName\": \"hf-token\", \"optional\": True},\n                    }\n\
          \                )\n                all_mounts.append(\n               \
          \     {\n                        \"name\": \"hf-token\",\n             \
          \           \"mountPath\": \"/var/run/secrets/huggingface\",\n         \
          \               \"readOnly\": True,\n                    }\n           \
          \     )\n            return PodSpecPatch(\n                volumes=all_vols,\n\
          \                containers=[ContainerPatch(name=\"node\", volume_mounts=all_mounts)],\n\
          \            )\n\n        resources = {\n            \"nvidia.com/gpu\"\
          : training_resource_gpu_per_worker,\n            \"memory\": training_resource_memory_per_worker,\n\
          \            \"cpu\": int(training_resource_cpu_per_worker),\n        }\n\
          \n        options = []\n        if tlbl:\n            from kubeflow.trainer.options.kubernetes\
          \ import Labels\n\n            options.append(Labels(labels=tlbl))\n   \
          \     if tann:\n            from kubeflow.trainer.options.kubernetes import\
          \ Annotations\n\n            options.append(Annotations(annotations=tann))\n\
          \        options.append(\n            RuntimePatch(\n                training_runtime_spec=TrainingRuntimeSpecPatch(\n\
          \                    template=JobSetTemplatePatch(\n                   \
          \     spec=JobSetSpecPatch(\n                            replicated_jobs=[\n\
          \                                ReplicatedJobPatch(\n                 \
          \                   name=\"node\",\n                                   \
          \ template=JobTemplatePatch(\n                                        spec=JobSpecPatch(\n\
          \                                            template=PodTemplatePatch(\n\
          \                                                spec=_pod_spec(),\n   \
          \                                         )\n                          \
          \              )\n                                    ),\n             \
          \                   )\n                            ]\n                 \
          \       )\n                    )\n                )\n            )\n   \
          \     )\n\n        # No func= passed -- Training Hub handles the lora_grpo()\
          \ call\n        # internally with a proper __main__ guard for multiprocessing.spawn.\n\
          \        # The worker reads HF_TOKEN through the secret-backed HF_TOKEN_PATH.\n\
          \        # Do not serialize the token value into the TrainJob environment.\n\
          \        trainer_env = {key: value for key, value in merged_env.items()\
          \ if key != \"HF_TOKEN\"}\n        job = client.train(\n            trainer=TrainingHubTrainer(\n\
          \                algorithm=TrainingHubAlgorithms.LORA_GRPO,\n          \
          \      func_args=params,\n                packages_to_install=[],\n    \
          \            env=trainer_env,\n                resources_per_node=resources,\n\
          \            ),\n            options=options,\n            runtime=runtime,\n\
          \        )\n        log.info(f\"Job: {job}\")\n        wait_for_training_job(\n\
          \            client,\n            job,\n            log,\n            completion_timeout_seconds=training_completion_timeout_seconds,\n\
          \        )\n    except Exception as e:\n        log.exception(f\"Training\
          \ failed: {e}\")\n        raise\n\n    # -- Post-training: locate adapter\
          \ checkpoint ------------------------\n    adapter_dirs = sorted(\n    \
          \    glob.glob(os.path.join(ckpt_dir, \".art\", \"*\", \"models\", \"*\"\
          , \"checkpoints\", \"*\")),\n        key=os.path.getmtime,\n    )\n    if\
          \ not adapter_dirs:\n        raise RuntimeError(\n            f\"No adapter\
          \ checkpoints found under {ckpt_dir}/.art/. Training Hub lora_grpo() may\
          \ have failed silently.\"\n        )\n\n    adapter_ckpt_path = adapter_dirs[-1]\n\
          \    log.info(f\"Latest adapter checkpoint: {adapter_ckpt_path}\")\n\n \
          \   # -- Post-training: merge LoRA adapters on CPU ----------------------\n\
          \    log.info(\"Merging LoRA adapters into base model (PEFT merge_and_unload\
          \ on CPU)...\")\n    from peft import PeftModel\n    from transformers import\
          \ AutoModelForCausalLM, AutoTokenizer\n\n    base_model = AutoModelForCausalLM.from_pretrained(resolved,\
          \ torch_dtype=\"auto\", low_cpu_mem_usage=True)\n    peft_model = PeftModel.from_pretrained(base_model,\
          \ adapter_ckpt_path)\n    merged_model = peft_model.merge_and_unload()\n\
          \n    merged_dir = os.path.join(ckpt_dir, \"grpo-merged\")\n    os.makedirs(merged_dir,\
          \ exist_ok=True)\n    merged_model.save_pretrained(merged_dir)\n\n    tokenizer\
          \ = AutoTokenizer.from_pretrained(resolved)\n    tokenizer.save_pretrained(merged_dir)\n\
          \    preserve_tokenizer_files(tokenizer, merged_dir, log)\n    normalize_tokenizer_config(merged_dir,\
          \ log)\n    log.info(f\"Merged model saved to {merged_dir}\")\n\n    # Free\
          \ memory after merge\n    del merged_model, peft_model, base_model\n\n \
          \   # -- Metrics and output artifacts ------------------------------------\n\
          \    def log_training_metrics():\n        output_metrics.log_metric(\"num_iterations\"\
          , float(params.get(\"num_iterations\", 5)))\n        output_metrics.log_metric(\"\
          group_size\", float(params.get(\"group_size\", 4)))\n        output_metrics.log_metric(\"\
          prompt_batch_size\", float(params.get(\"prompt_batch_size\", 50)))\n   \
          \     output_metrics.log_metric(\"n_train\", float(params.get(\"n_train\"\
          , 200)))\n        output_metrics.log_metric(\"learning_rate\", float(params.get(\"\
          learning_rate\", 1e-5)))\n        output_metrics.log_metric(\"gpu_memory_utilization\"\
          , float(params.get(\"gpu_memory_utilization\", 0.45)))\n        output_metrics.log_metric(\"\
          lora_r\", float(params.get(\"lora_r\", 16)))\n        output_metrics.log_metric(\"\
          lora_alpha\", float(params.get(\"lora_alpha\", 8)))\n        if adapter_ckpt_path:\n\
          \            output_metrics.metadata[\"adapter_checkpoint\"] = adapter_ckpt_path\n\
          \n    log_training_metrics()\n\n    # persist_model targets the merged model\
          \ directory directly so that\n    # find_model_dir cannot accidentally pick\
          \ an ART adapter's config.json.\n    persist_model(merged_dir, pvc_path,\
          \ training_base_model, output_model, log)\n\n    if adapter_ckpt_path:\n\
          \        output_model.metadata[\"adapter_checkpoint\"] = adapter_ckpt_path\n\
          \n    return os.path.join(ckpt_dir, \"training_results.json\")\n\n"
        image: quay.io/opendatahub/odh-th-torch-cpu-py312:odh-3.6-ea.2
pipelineInfo:
  description: 'LoRA GRPO pipeline: reinforcement learning from verifiable rewards
    using ART backend on a single GPU TrainJob'
  name: lora-grpo-pipeline
root:
  dag:
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - grpo-eval
        - train-model
        inputs:
          artifacts:
            pipelinechannel--grpo-eval-output_metrics:
              taskOutputArtifact:
                outputArtifactKey: output_metrics
                producerTask: grpo-eval
            pipelinechannel--grpo-eval-output_reward_chart:
              taskOutputArtifact:
                outputArtifactKey: output_reward_chart
                producerTask: grpo-eval
            pipelinechannel--train-model-output_metrics:
              taskOutputArtifact:
                outputArtifactKey: output_metrics
                producerTask: train-model
            pipelinechannel--train-model-output_model:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: train-model
          parameters:
            pipelinechannel--grpo-eval-promotion_passed:
              taskOutputParameter:
                outputParameterKey: promotion_passed
                producerTask: grpo-eval
            pipelinechannel--phase_00_infra_man_pvc_name:
              componentInputParameter: phase_00_infra_man_pvc_name
            pipelinechannel--phase_02_train_man_model:
              componentInputParameter: phase_02_train_man_model
            pipelinechannel--phase_04_registry_man_address:
              componentInputParameter: phase_04_registry_man_address
            pipelinechannel--phase_04_registry_man_name:
              componentInputParameter: phase_04_registry_man_name
            pipelinechannel--phase_04_registry_man_version:
              componentInputParameter: phase_04_registry_man_version
            pipelinechannel--phase_04_registry_opt_author:
              componentInputParameter: phase_04_registry_opt_author
            pipelinechannel--phase_04_registry_opt_description:
              componentInputParameter: phase_04_registry_opt_description
            pipelinechannel--phase_04_registry_opt_format_name:
              componentInputParameter: phase_04_registry_opt_format_name
            pipelinechannel--phase_04_registry_opt_format_version:
              componentInputParameter: phase_04_registry_opt_format_version
            pipelinechannel--phase_04_registry_opt_port:
              componentInputParameter: phase_04_registry_opt_port
            pipelinechannel--phase_05_deploy_man_namespace:
              componentInputParameter: phase_05_deploy_man_namespace
            pipelinechannel--phase_05_deploy_opt_cpu_requests:
              componentInputParameter: phase_05_deploy_opt_cpu_requests
            pipelinechannel--phase_05_deploy_opt_gpu_count:
              componentInputParameter: phase_05_deploy_opt_gpu_count
            pipelinechannel--phase_05_deploy_opt_max_model_len:
              componentInputParameter: phase_05_deploy_opt_max_model_len
            pipelinechannel--phase_05_deploy_opt_max_replicas:
              componentInputParameter: phase_05_deploy_opt_max_replicas
            pipelinechannel--phase_05_deploy_opt_memory_requests:
              componentInputParameter: phase_05_deploy_opt_memory_requests
            pipelinechannel--phase_05_deploy_opt_min_replicas:
              componentInputParameter: phase_05_deploy_opt_min_replicas
            pipelinechannel--phase_05_deploy_opt_tokenizer_mode:
              componentInputParameter: phase_05_deploy_opt_tokenizer_mode
        taskInfo:
          name: promotion-gate
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--grpo-eval-promotion_passed']
            == true
      grpo-eval:
        cachingOptions: {}
        componentRef:
          name: comp-grpo-eval
        dependentTasks:
        - train-model
        inputs:
          parameters:
            training_results_path:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: train-model
        taskInfo:
          name: grpo-eval
      train-model:
        cachingOptions: {}
        componentRef:
          name: comp-train-model
        inputs:
          parameters:
            pvc_path:
              runtimeValue:
                constant: /mnt/pipeline
            training_base_model:
              componentInputParameter: phase_02_train_man_model
            training_data_config:
              componentInputParameter: phase_02_train_opt_data_config
            training_data_path:
              componentInputParameter: phase_01_dataset_man_data_uri
            training_enforce_eager:
              componentInputParameter: phase_02_train_opt_enforce_eager
            training_envs:
              componentInputParameter: phase_02_train_opt_env_vars
            training_gpu_memory_utilization:
              componentInputParameter: phase_02_train_opt_gpu_memory_utilization
            training_group_size:
              componentInputParameter: phase_02_train_man_group_size
            training_learning_rate:
              componentInputParameter: phase_02_train_opt_learning_rate
            training_lora_alpha:
              componentInputParameter: phase_02_train_man_lora_alpha
            training_lora_r:
              componentInputParameter: phase_02_train_man_lora_r
            training_metadata_annotations:
              componentInputParameter: phase_02_train_opt_annotations
            training_metadata_labels:
              componentInputParameter: phase_02_train_opt_labels
            training_n_train:
              componentInputParameter: phase_02_train_opt_n_train
            training_num_iterations:
              componentInputParameter: phase_02_train_man_num_iterations
            training_prompt_batch_size:
              componentInputParameter: phase_02_train_man_prompt_batch_size
            training_pvc_name:
              componentInputParameter: phase_00_infra_man_pvc_name
            training_resource_cpu_per_worker:
              componentInputParameter: phase_02_train_opt_cpu
            training_resource_gpu_per_worker:
              componentInputParameter: phase_02_train_opt_gpu
            training_resource_memory_per_worker:
              componentInputParameter: phase_02_train_opt_memory
            training_run_id:
              runtimeValue:
                constant: '{{$.pipeline_job_uuid}}'
            training_runtime:
              componentInputParameter: phase_02_train_opt_runtime
            training_use_hf_direct:
              runtimeValue:
                constant: true
        taskInfo:
          name: train-model
  inputDefinitions:
    parameters:
      phase_00_infra_man_pvc_name:
        description: 'Name of the ReadWriteMany PVC used for

          training checkpoints and model serving. To create one: in RHOAI open

          your Data Science Project -> Cluster Storage -> Create storage, select

          ReadWriteMany access mode, minimum 50Gi. Enter only the PVC name

          (not a path). Example: ``grpo-pipeline-pvc``'
        parameterType: STRING
      phase_01_dataset_man_data_uri:
        defaultValue: hf://Agent-Ark/Toucan-1.5M:Qwen3
        description: 'Hugging Face dataset URI. Defaults to

          ``hf://Agent-Ark/Toucan-1.5M:Qwen3`` (a public tool-calling dataset

          used as a reference example). Use ``hf://org/dataset`` or

          ``hf://org/dataset:config``. The ``hf://`` prefix is optional when

          supplying a Hugging Face repository ID. Some datasets have multiple

          configs; append ``:config`` or set ``phase_02_train_opt_data_config``.'
        isOptional: true
        parameterType: STRING
      phase_02_train_man_group_size:
        defaultValue: 4.0
        description: 'Rollouts generated per prompt to estimate

          relative reward advantage. Higher = better gradient signal but more

          memory and time. Default 4 is suitable for single-GPU runs.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_man_lora_alpha:
        defaultValue: 16.0
        description: 'LoRA scaling factor. Effective weight

          scale = ``lora_alpha / lora_r``. Set equal to ``lora_r`` for neutral

          scaling (recommended). Example: ``16``'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_man_lora_r:
        defaultValue: 16.0
        description: 'LoRA adapter rank. Higher = more adapter

          capacity but slower training and more memory. Typical values: 8

          (lightweight), 16 (balanced), 32 (high capacity). Example: ``16``'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_man_model:
        defaultValue: Qwen/Qwen3-4B
        description: 'HuggingFace model ID of the base model to

          fine-tune. If the model is gated, configure the ``hf-token`` secret.

          Example: ``Qwen/Qwen3-4B`` or ``ibm-granite/granite-3.3-8b-instruct``'
        isOptional: true
        parameterType: STRING
      phase_02_train_man_num_iterations:
        defaultValue: 50.0
        description: 'Number of GRPO policy-gradient update

          steps. Each iteration generates ``group_size`` rollouts per prompt

          and updates the LoRA adapter. The promotion gate (stage 3) requires

          ``final_reward > initial_reward`` - fewer than 30 iterations rarely

          pass it. Default 50 runs in ~1-2 hours on one A100 80GB with

          Qwen3-4B. Use 100+ for a production-quality training run.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_man_prompt_batch_size:
        defaultValue: 50.0
        description: 'Prompts processed per GRPO update

          step. Total rollout batch = ``prompt_batch_size x group_size``

          (e.g., 50 x 4 = 200). Reduce if you hit out-of-memory errors.

          Example: ``50``'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_opt_annotations:
        defaultValue: ''
        description: 'Comma-separated ``key=value``

          annotations applied to the TrainJob worker pod. Leave empty if

          not needed.'
        isOptional: true
        parameterType: STRING
      phase_02_train_opt_cpu:
        defaultValue: '4'
        description: 'CPU cores requested for the TrainJob worker pod.

          Example: ``4``'
        isOptional: true
        parameterType: STRING
      phase_02_train_opt_data_config:
        defaultValue: Qwen3
        description: 'HuggingFace dataset config (split or

          subset name). Only needed for multi-config datasets. Defaults to

          ``Qwen3`` to match the default dataset

          (``hf://Agent-Ark/Toucan-1.5M:Qwen3``). If you override

          ``phase_01_dataset_man_data_uri`` with a single-config dataset,

          set this to an empty string.'
        isOptional: true
        parameterType: STRING
      phase_02_train_opt_enforce_eager:
        defaultValue: true
        description: 'Disables torch.compile and CUDA graph

          capture in vLLM. Must be True for Qwen3 models (known CUDAGraph

          incompatibility). Set False for other models for faster rollouts.'
        isOptional: true
        parameterType: BOOLEAN
      phase_02_train_opt_env_vars:
        defaultValue: ''
        description: 'Comma-separated ``KEY=VALUE`` environment

          variables injected into the training pod. Leave empty if not needed.

          Example: ``NCCL_DEBUG=INFO,TORCH_DISTRIBUTED_DEBUG=DETAIL``'
        isOptional: true
        parameterType: STRING
      phase_02_train_opt_gpu:
        defaultValue: 1.0
        description: 'GPUs per TrainJob worker. ART requires exactly

          1 GPU per worker - do not change this.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_opt_gpu_memory_utilization:
        defaultValue: 0.45
        description: 'Fraction of GPU VRAM given

          to the vLLM rollout engine (remainder goes to the policy model and

          optimizer). Default 0.45 is tuned for Qwen3-4B on a 80GB A100.

          Reduce to 0.35 if you see OOM during rollout generation.'
        isOptional: true
        parameterType: NUMBER_DOUBLE
      phase_02_train_opt_labels:
        defaultValue: ''
        description: 'Comma-separated ``key=value`` labels applied

          to the TrainJob worker pod for cost tracking or scheduling

          constraints. Leave empty if not needed.

          Example: ``team=ml,project=grpo``'
        isOptional: true
        parameterType: STRING
      phase_02_train_opt_learning_rate:
        defaultValue: 1.0e-05
        description: 'AdamW learning rate for LoRA adapter

          updates. ``1e-5`` is a safe default; increase to ``5e-5`` if reward

          improvement is too slow.'
        isOptional: true
        parameterType: NUMBER_DOUBLE
      phase_02_train_opt_memory:
        defaultValue: 64Gi
        description: 'RAM requested for the TrainJob worker pod.

          For Qwen3-4B on an 80GB GPU, 64Gi is sufficient.

          Example: ``64Gi``'
        isOptional: true
        parameterType: STRING
      phase_02_train_opt_n_train:
        defaultValue: 200.0
        description: 'Maximum rows ART draws from the dataset

          per run. This is independent of the total dataset size.

          Example: ``200`` for quick tests, ``2000`` for a fuller run.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_02_train_opt_runtime:
        defaultValue: training-hub
        description: 'Name of the ClusterTrainingRuntime CR that

          defines the base container image. Check available runtimes with:

          ``oc get clustertrainingruntimes``. Default: ``training-hub``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_man_address:
        description: 'Hostname or IP address of the Model

          Registry service (required). Pass only the host or IP, without

          ``http://``, ``https://``, or the ``/api/model_registry/v1alpha3``

          path.'
        parameterType: STRING
      phase_04_registry_man_name:
        defaultValue: grpo-model
        description: 'Name to register the model under. Must be

          unique within your Model Registry.

          Example: ``qwen3-grpo-tool-call``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_man_version:
        defaultValue: 1.0.0
        description: 'Version tag for this model revision.

          Use semantic versioning. Example: ``1.0.0``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_opt_author:
        defaultValue: pipeline
        description: 'Author name attached to the registry

          entry. Example: ``your-team-name``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_opt_description:
        defaultValue: ''
        description: 'Free-text description stored with

          the registered model. Example: ``Qwen3-4B fine-tuned with GRPO

          for tool-calling tasks``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_opt_format_name:
        defaultValue: pytorch
        description: 'Model serialization format in the

          registry. Use ``pytorch`` for vLLM-served models.

          Example: ``pytorch``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_opt_format_version:
        defaultValue: '1.0'
        description: 'Version of the model format.

          Use ``1.0`` for PyTorch. Example: ``1.0``'
        isOptional: true
        parameterType: STRING
      phase_04_registry_opt_port:
        defaultValue: 8080.0
        description: 'Port of the Model Registry service.

          Default 8080 matches a typical internal HTTP registry.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_05_deploy_man_namespace:
        description: 'OpenShift project where the KServe

          InferenceService will be created. Must be the same namespace where

          your PVC is provisioned. Should have

          KServe enabled - typically your Data Science Project.

          Example: ``my-ds-project``'
        parameterType: STRING
      phase_05_deploy_opt_cpu_requests:
        defaultValue: '2'
        description: 'CPU cores requested and limited for

          the KServe predictor pod. Example: ``2``'
        isOptional: true
        parameterType: STRING
      phase_05_deploy_opt_gpu_count:
        defaultValue: 1.0
        description: 'GPUs allocated to the KServe vLLM

          predictor pod. 1 GPU is sufficient for Qwen3-4B. Example: ``1``'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_05_deploy_opt_max_model_len:
        defaultValue: 4096.0
        description: 'Maximum total token length

          (prompt + completion) vLLM will handle. Longer contexts use more

          VRAM. Default 4096 is adequate for tool-call traces. Increase to

          8192 for longer prompts.'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_05_deploy_opt_max_replicas:
        defaultValue: 1.0
        description: 'Maximum predictor replicas for

          autoscaling. Set equal to ``min_replicas`` to disable scaling.

          Example: ``1``'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_05_deploy_opt_memory_requests:
        defaultValue: 8Gi
        description: 'RAM requested and limited for the

          KServe predictor pod. Example: ``8Gi``'
        isOptional: true
        parameterType: STRING
      phase_05_deploy_opt_min_replicas:
        defaultValue: 1.0
        description: 'Minimum live KServe predictor

          replicas. Set to 1 to keep the endpoint always warm.

          Example: ``1``'
        isOptional: true
        parameterType: NUMBER_INTEGER
      phase_05_deploy_opt_tokenizer_mode:
        defaultValue: auto
        description: 'vLLM tokenizer mode. ``auto`` uses

          the fast tokenizer when available. Use ``slow`` when the model

          requires its HuggingFace slow tokenizer. Use ``mistral`` for models

          that require the ``mistral_common`` tokenizer. Default: ``auto``'
        isOptional: true
        parameterType: STRING
