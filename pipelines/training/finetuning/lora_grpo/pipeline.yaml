          \ split first\n        load_kwargs = {\n            \"path\": ds_id,\n \
          \           \"split\": \"train\",\n            \"cache_dir\": hf_datasets_cache,\n\
          \        }\n        if ds_config:\n            load_kwargs[\"name\"] = ds_config\n\
          \n        if hf_token:\n            load_kwargs[\"token\"] = hf_token\n\n\
          \        try:\n            dataset = load_dataset(**load_kwargs)\n     \
          \       log_message(f\"Downloaded {len(dataset)} examples from HuggingFace\
          \ (split: train)\")\n            return dataset\n\n        except ValueError\
          \ as e:\n            # If \"train\" split doesn't exist, try to find an\
          \ alternative\n            if \"Unknown split\" in str(e):\n           \
          \     log_message(\"'train' split not found, attempting to detect available\
