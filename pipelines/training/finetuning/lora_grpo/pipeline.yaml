          \  # =========================================================================\n\
          \    # Main execution\n    # =========================================================================\n\
          \n    log_message(\"=\" * 60)\n    log_message(\"Dataset Download Component\
          \ Started\")\n    log_message(\"=\" * 60)\n    log_message(f\"Dataset URI:\
          \ {dataset_uri}\")\n    log_message(f\"Train/Eval split: {train_split_ratio:.0%}/{1\
          \ - train_split_ratio:.0%}\")\n    log_message(f\"Subset count: {subset_count\
