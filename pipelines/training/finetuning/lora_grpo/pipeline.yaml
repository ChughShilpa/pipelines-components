          \ \"w\", encoding=\"utf-8\") as artifact_file:\n                    _json.dump(\n\
          \                        {\n                            \"dataset_uri\"\
          : dataset_uri,\n                            \"split\": split,\n        \
          \                    \"num_examples\": count,\n                        \
          \    \"pvc_path\": pvc_path,\n                        },\n             \
          \           artifact_file,\n                    )\n\n        # Save metadata\n\
          \        train_dataset.metadata = {\n            \"dataset_uri\": dataset_uri,\n\
